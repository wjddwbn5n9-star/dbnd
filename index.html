<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Para você ❤️</title>

    <style>
        body {
            margin: 0;
            padding: 60px 25px;

            background: black;
            color: white;

            font-family: Georgia, "Times New Roman", serif;
            text-align: center;

            font-size: 25px;
            line-height: 1.45;
        }

        .texto {
            max-width: 700px;
            margin: 0 auto;
        }

        p {
            margin: 0 0 22px 0;
        }

        .coracao {
            font-size: 55px;
            margin-top: 45px;
        }
    </style>
</head>

<body>

    <div class="texto">

        <p>
            Quero que você saiba que eu te amo.
        </p>

        <p>
            Nunca dei flores para ninguém,<br>
            então espero que você goste.
        </p>

        <p>
            Nunca tinha dito “eu te amo”<br>
            antes.
        </p>

        <p>
            Sei que você não gosta dessa<br>
            minha imaturidade, mas eu quero<br>
            melhorar por você,<br>
            para que possa existir um “a gente”.
        </p>

        <p>
            Me perdoa.
        </p>

        <div class="coracao">
            ❤️
        </div>

    </div>

</body>
</html>
